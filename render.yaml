services:
  - type: web
    name: pitwall-api
    runtime: docker
    dockerfilePath: apps/backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DEBUG
        value: "false"
      - key: FASTF1_NO_CACHE
        value: "true"
      - key: PREFER_SEEDED_DATA
        value: "true"
    healthCheckPath: /health
